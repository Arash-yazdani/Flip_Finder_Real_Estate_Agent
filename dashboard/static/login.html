<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in - FlipFinder</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .login-card h1 { position: relative; display: inline-block; }
    .login-card h1::after {
      content: ""; position: absolute; left: 0; bottom: -5px;
      width: 34px; height: 4px; border-radius: 3px; background: #E8901A;
    }
    .request-note { margin-top: 1.1rem; font-size: 0.84rem; }
    .request-note a { color: #C97A0E; font-weight: 600; }

    /* The commercial plays behind the sign-in card: the ad works on people while they
       contemplate signing in. Scrim keeps the card readable; card lifts above it. */
    /* Positive stacking: an opaque body background paints OVER negative-z fixed
       children (root stacking context), so the layers sit above it instead and the
       card rises above them. pointer-events: none keeps the form clickable. */
    .bg-video, .bg-scrim { position: fixed; inset: 0; pointer-events: none; }
    .bg-video {
      width: 100%; height: 100%; object-fit: cover; z-index: 0;
      background: #F4F6F8 url("/static/landing-poster.jpg") center/cover no-repeat;
    }
    .bg-scrim { z-index: 1; background: rgba(244, 246, 248, 0.62); backdrop-filter: blur(1.5px); }
    .login-card {
      position: relative; z-index: 2; background: #FFFFFF;
      box-shadow: 0 24px 70px rgba(20, 30, 50, 0.28);
    }
    @media (prefers-reduced-motion: reduce) { .bg-video { display: none; } }
  </style>
</head>
<body class="login-body">
  <video class="bg-video" autoplay muted loop playsinline preload="metadata"
         poster="/static/landing-poster.jpg" aria-hidden="true">
    <source src="/static/flipfinder-commercial.mp4" type="video/mp4">
  </video>
  <div class="bg-scrim" aria-hidden="true"></div>
  <main class="login-card">
    <h1>FlipFinder.</h1>
    <p class="muted">Sign in with your approved account</p>
    <form id="login-form">
      <input type="email" id="email" name="email" autocomplete="username"
             placeholder="Email" autofocus required>
      <input type="password" id="password" name="password"
             autocomplete="current-password" placeholder="Password" required>
      <button type="submit">Sign in</button>
      <p id="error" class="error" hidden></p>
    </form>
    <p class="muted request-note">No account yet? FlipFinder is invite only.
      <a href="mailto:hello@modeo.io?subject=FlipFinder%20access%20request&body=Name%3A%0AMarkets%20I%20invest%20in%3A%0ADeals%20in%20the%20last%2012%20months%3A%0AEmail%20to%20provision%3A%0A%0AAnything%20else%3A%0A">Request access</a>
    </p>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const pw = document.getElementById("password").value;
      const err = document.getElementById("error");
      err.hidden = true;
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          credentials: "include",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({email: email, password: pw}),
        });
        if (r.ok) {
          window.location = "/app";
        } else {
          const data = await r.json().catch(() => ({}));
          err.textContent = data.detail || "Sign-in failed";
          err.hidden = false;
        }
      } catch (e) {
        err.textContent = e.message;
        err.hidden = false;
      }
    });
  </script>
</body>
</html>
